<div class="fixed top-0 z-100 flex w-full border-b border-b-surface justify-between items-center p-4 md:px-12 bg-background/80 backdrop-blur-md">

  <div class="flex justify-center">
    <p class="uppercase font-bold tracking-widest text-lg md:text-xl text-white glow-title hover:cursor-pointer underline-slide" (click)="navigateToHome()">
      lg / portfolio
    </p>
  </div>

  <div class="hidden md:flex w-fit justify-start text-text gap-8 font-semibold text-sm items-center">
    <p class="underline-slide hover:border-b-accent cursor-pointer"> Experience</p>
    <p class="underline-slide hover:border-b-accent cursor-pointer"> Education </p>
    <p class="underline-slide hover:border-b-accent cursor-pointer"> About </p>
    <p class="underline-slide hover:border-b-accent cursor-pointer"> Contact </p>
  </div>

  <div class="flex justify-end gap-3 md:gap-4 items-center">
    <a class="hidden sm:block text-primary px-3 py-1 md:px-4 md:py-2 font-mono text-xs md:text-sm font-bold hover:bg-background border border-primary hover:border-zinc-800 transition-all"
       href="YOUR_RESUME_URL"
       target="_blank">
      Resume
    </a>

    <button (click)="toggleMenu()" class="md:hidden text-white p-2 focus:outline-none" aria-label="Toggle menu">
      @if (!isMenuOpen) {
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path></svg>
      } @else {
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
      }
    </button>
  </div>
</div>

<div
  [class.hidden]="!isMenuOpen"
  class="fixed top-16 left-0 w-full bg-background/95 backdrop-blur-lg border-b border-surface flex flex-col items-center gap-6 py-8 z-90 md:hidden transition-all animate-in slide-in-from-top duration-300">

  <p (click)="toggleMenu()" class="text-text font-semibold text-lg cursor-pointer">Experience</p>
  <p (click)="toggleMenu()" class="text-text font-semibold text-lg cursor-pointer">Education</p>
  <p (click)="toggleMenu()" class="text-text font-semibold text-lg cursor-pointer">About</p>
  <p (click)="toggleMenu()" class="text-text font-semibold text-lg cursor-pointer">Contact</p>

  <a class="text-primary px-6 py-2 font-mono text-sm font-bold border border-primary"
     href="YOUR_RESUME_URL"
     target="_blank"
     (click)="toggleMenu()">
    Resume
  </a>
</div>
