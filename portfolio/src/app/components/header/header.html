<div class="fixed top-0 z-100 flex w-full border-b border-b-surface justify-between items-center p-4 md:px-12 bg-background/80 backdrop-blur-md">

  <div class="flex justify-center">
    <p class="uppercase font-bold tracking-widest text-lg md:text-xl text-white glow-title hover:cursor-pointer underline-slide" (click)="navigateToHome()">
      lg / portfolio
    </p>
  </div>

  <div class="hidden md:flex w-fit justify-start text-text gap-8 font-semibold text-sm items-center">
    <p class="underline-slide hover:border-b-accent cursor-pointer" (click)="navigateTo(urls.projetcts)"> Projects </p>
    <p class="underline-slide hover:border-b-accent cursor-pointer" (click)="navigateTo(urls.contact)"> Contact </p>
  </div>

  <div class="flex justify-end gap-3 md:gap-4 items-center">
    <a href="https://github.com/Zeleo21" target="_blank"
       class="flex items-center gap-2 text-text hover:text-white transition-colors duration-200 font-mono text-sm">
      <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2C6.477 2 2 6.477 2 12c0 4.418 2.865 8.166 6.839 9.489.5.092.682-.217.682-.482 0-.237-.009-.868-.013-1.703-2.782.604-3.369-1.34-3.369-1.34-.454-1.156-1.11-1.463-1.11-1.463-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.087 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.578 9.578 0 0 1 12 6.836a9.59 9.59 0 0 1 2.504.337c1.909-1.294 2.747-1.025 2.747-1.025.546 1.377.203 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.741 0 .267.18.578.688.48C19.138 20.163 22 16.418 22 12c0-5.523-4.477-10-10-10z"/>

      <span>GitHub</span>
    </a>

    <button (click)="toggleMenu()" class="md:hidden text-white p-2 focus:outline-none" aria-label="Toggle menu">
      @if (!isMenuOpen) {
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path></svg>
      } @else {
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
      }
    </button>
  </div>
</div>

<div
  [class.hidden]="!isMenuOpen"
  class="fixed top-16 left-0 w-full bg-background/95 backdrop-blur-lg border-b border-surface flex flex-col items-center gap-6 py-8 z-90 md:hidden transition-all animate-in slide-in-from-top duration-300">
  <p (click)="navigateTo(urls.projetcts, true)" class="text-text font-semibold text-lg cursor-pointer">Projects</p>
  <p (click)="navigateTo(urls.contact, true)" class="text-text font-semibold text-lg cursor-pointer">Contact</p>

  <a href="https://github.com/Zeleo21" target="_blank"
     class="flex items-center gap-2 font-semibold text-lg text-text hover:text-white transition-colors duration-200 font-mono">
    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor">

</div>
