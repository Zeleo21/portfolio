<div class="min-h-48 flex flex-col border border-zinc-800 mr-4 ml-4 rounded p-2 cursor-pointer hover:border-zinc-600 transition-colors duration-200 active:border-zinc-600 active:scale-95"
     (click)="onCardClick()">
  <div class="flex justify-between">
    <div class="flex justify-start items-center gap-1">
      @for (tagStyle of tagStyles(); track tagStyle.label) {
        <span [class]="tagStyle.badgeClasses">{{ tagStyle.label }}</span>
      }
    </div>
  </div>
  <div class="flex-1 flex flex-col">
    <div class="mt-4 mb-2 text-primary font-medium">
      {{ this.title() }}
    </div>
    <div class="mb-4 text-muted text-xs">
      {{ this.shortDescription() }}
    </div>
  </div>
  <div class="flex justify-between">
    @if (this.displayGithubLink()) {
      <a [href]="githubLink()" target="_blank" (click)="$event.stopPropagation()"
         class="flex items-center gap-2 text-muted hover:text-white transition-colors duration-200 font-mono text-sm">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2C6.477 2 2 6.477 2 12c0 4.418 2.865 8.166 6.839 9.489.5.092.682-.217.682-.482 0-.237-.009-.868-.013-1.703-2.782.604-3.369-1.34-3.369-1.34-.454-1.156-1.11-1.463-1.11-1.463-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.087 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.578 9.578 0 0 1 12 6.836a9.59 9.59 0 0 1 2.504.337c1.909-1.294 2.747-1.025 2.747-1.025.546 1.377.203 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.741 0 .267.18.578.688.48C19.138 20.163 22 16.418 22 12c0-5.523-4.477-10-10-10z"/>
        </svg>
        <span>GitHub</span>
      </a>
    } @else {
      <div></div>
    }
    <div>
      <svg class="w-5 h-5 text-muted" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 18l6-6-6-6"/>
      </svg>
    </div>
  </div>
</div>
